    <!-- POL-3: the large-image card gets its image — public/og-image.png
         (1200x630 brand card, generated by scripts/make-og-image.py from
         the law in src/ui/shareCard.ts). Relative on purpose: it resolves

    <!-- POL-1: the tab carries the brand too — the R259 mark
         (titleBrand.ts geometry on the navy plate) as the favicon,
         and the browser chrome tinted to the boot background. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#14100a" />
    <!-- R275: critical boot CSS is inline so the loading screen below
         paints on first paint — before this stylesheet or the module
         bundle arrive. Boot classes are unique to this block. -->
    <style>html{background:#14100a}#boot-loading{z-index:9999;background:#14100a;justify-content:center;align-items:center;font-family:Segoe UI,Liberation Sans,Arial,sans-serif;display:flex;position:fixed;inset:0}.boot-card{color:#faf3e0;text-align:center;background:#1c2333;border:2.5px solid #3a4b66;border-top:6px solid #f2a81d;border-radius:10px;max-width:min(520px,100vw - 48px);padding:26px 32px;box-shadow:0 14px 36px #000000b8}.boot-logo{width:min(260px,80%);height:auto;margin:0 auto 10px;display:block}.boot-wordmark{letter-spacing:.04em;color:#faf3e0;margin:0;font-family:Franklin Gothic Medium,Arial Narrow,Liberation Sans Narrow,Arial,sans-serif;font-size:1.65rem}.boot-slogan{color:#f2a81d;letter-spacing:.08em;margin-top:6px;font-size:.82rem;font-weight:700}.boot-bar{background:#14100a;border:2px solid #3a4b66;border-radius:999px;height:12px;margin-top:20px;overflow:hidden}.boot-bar-fill{background:#e85d1f;border-radius:999px;width:6%;height:100%;animation:16s ease-out forwards boot-fill}@keyframes boot-fill{to{width:88%}}.boot-stage{color:#f3e9d2;margin-top:12px;font-size:.9rem}</style>

  <body data-state="title">
    <!-- R275: branded progress state from first paint until the game
         dismisses it at the end of init (src/ui/bootScreen.ts). -->
    <div id="boot-loading" role="status" aria-label="North American Plow is loading">
      <div class="boot-card">
        <img class="boot-logo" src="/assets/aistudio/image_45d3a32e.png" alt="North American Plow emblem" />
        <h1 class="boot-wordmark">NORTH AMERICAN PLOW</h1>
        <div class="boot-slogan">PUSH SNOW. BUILD A BUSINESS.</div>
        <div class="boot-bar" role="progressbar" aria-label="Loading">
          <div class="boot-bar-fill"></div>
        </div>
        <div id="boot-stage" class="boot-stage">Loading…</div>
        <noscript>
          <div class="boot-stage">This game needs JavaScript — enable it and reload.</div>
        </noscript>
      </div>
    </div>
    <!-- POL-2: boot watchdog — failBootScreen() lives in the module
         bundle, so if that bundle itself never loads (404, parse
         error, blocked script) nothing would ever call it and this
         card would sit on "Loading…" forever, bar frozen at 88%.
         This inline timer is the seam's last resort: if the boot
         card is still up after 30000 ms (BOOT_WATCHDOG_TIMEOUT_MS in
         src/ui/bootScreen.ts), say so plainly. A live load dismisses
         the card first, so the timer no-ops; a late success removes
         the whole card, failure line and all. -->
    <script>
      window.setTimeout(function () {
        var stage = document.getElementById('boot-stage');
        if (stage && document.getElementById('boot-loading')) {
          stage.textContent = 'Loading failed — check your connection and reload.';
        }
      }, 30000);
    </script>
    <div id="root"></div>
    <main id="game-shell" aria-label="North American Plow Snow Plow Simulator"></main>
  </body>
</html>
